name: support-ticket-ai-system

services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 1234
    ports:
      - "1234:1234"
    env_file:
      - .env
    restart: unless-stopped

  ui:
    build: .
    command: streamlit run ui.py --server.address 0.0.0.0 --server.port 1456
    ports:
      - "1456:1456"
    environment:
      - API_BASE=http://api:1234
    depends_on:
      - api
    restart: unless-stopped
